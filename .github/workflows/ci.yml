# The scanner's tests, for its own repository, with the scanner at its
# root.
#
# A test checks the scanner's results against the schema the server reads
# them with, scan/scan-result.schema.json from graphnous/graphnous-schemas.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SCHEMA_URL: https://graphnous.github.io/graphnous-schemas/schema/scan/scan-result.schema.json
  SCHEMA_PATH: ${{ github.workspace }}/.schemas/scan-result.schema.json

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the scan result schema
        uses: actions/checkout@v4
        with:
          repository: graphnous/graphnous-schemas
          path: .schemas
          sparse-checkout: scan

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the generated types match the schema
        run: |
          npm run generate -- "$SCHEMA_PATH"
          git diff --exit-code src/generated || {
            echo "::error::src/generated is out of date with the published schema. Run npm run generate and commit the result."
            exit 1
          }

      - run: npm test
        env:
          GRAPHNOUS_SCAN_RESULT_SCHEMA: ${{ github.workspace }}/.schemas/scan/scan-result.schema.json

      # Also typechecks, and bundles scanner.js as the server runs it
      - run: npm run build

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
