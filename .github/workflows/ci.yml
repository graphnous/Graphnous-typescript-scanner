# The scanner's tests, for its own repository, with the scanner at its
# root.
#
# A test checks the scanner's results against the schema the server reads
# them with, graphnous-schemas/scan/scan-result.schema.json, from the
# repository that holds it: the SCHEMAS_REPOSITORY variable, by default
# graphnous/Graphnous-2. That repository is private, so this needs a
# SCHEMAS_TOKEN secret that can read its contents.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the scan result schema
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SCHEMAS_REPOSITORY || 'graphnous/Graphnous-2' }}
          token: ${{ secrets.SCHEMAS_TOKEN }}
          path: .schemas
          sparse-checkout: graphnous-schemas/scan

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          GRAPHNOUS_SCAN_RESULT_SCHEMA: ${{ github.workspace }}/.schemas/graphnous-schemas/scan/scan-result.schema.json

      # Also typechecks, and bundles scanner.js as the server runs it
      - run: npm run build
