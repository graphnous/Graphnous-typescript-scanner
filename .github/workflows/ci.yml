# The scanner's tests, for its own repository, with the scanner at its
# root.
#
# The scanner's results are checked against the scan result schema the
# server reads them with, as graphnous-schemas publishes it. The types in
# src/generated must be generated from that same schema.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SCHEMA_URL: https://graphnous.github.io/graphnous-schemas/schema/scan/scan-result.schema.json
  SCHEMA_PATH: ${{ github.workspace }}/.schemas/scan-result.schema.json

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the scan result schema
        run: curl -sSf --retry 3 --create-dirs -o "$SCHEMA_PATH" "$SCHEMA_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the generated types match the schema
        run: |
          npm run generate -- "$SCHEMA_PATH"
          git diff --exit-code src/generated || {
            echo "::error::src/generated is out of date with the published schema. Run npm run generate and commit the result."
            exit 1
          }

      - run: npm test
        env:
          GRAPHNOUS_SCAN_RESULT_SCHEMA: ${{ env.SCHEMA_PATH }}

      # Also typechecks, and bundles scanner.js as the server runs it
      - run: npm run build

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
