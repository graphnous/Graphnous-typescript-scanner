# Publishes scanner.js as a release asset for each v* tag, such as v0.1.0.
# The server's image downloads it from the release of the version it pins.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" build/scanner.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
